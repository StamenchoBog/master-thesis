name: fl-ids-msc-edge

### MSc hybrid topology — Raspberry Pi side.
# Joins the host federation over the LAN as the 4th node (partition 3).
# Requires HOST_IP in the environment or a .env file next to this compose
# file on the Pi.
#
# The Pi's data dir holds only its own partition cache, shipped from the host:
#   data/.cache/msc/partition_3_of_4.npz
# Checkpoints go to the SD card deliberately — checkpoint I/O is a measured
# quantity, so they must NOT be moved to /dev/shm.

services:

  supernode-4:
    image: flwr/supernode:1.29.0
    container_name: msc-supernode-4
    command:
      - --insecure
      - --superlink
      # :9092 direct (LAN); set FLEET_PORT=19092 for the toxiproxy WAN condition.
      - ${HOST_IP:?set HOST_IP to the host machine LAN address}:${FLEET_PORT:-9092}
      - --clientappio-api-address
      - 0.0.0.0:9097
      - --isolation
      - process
      - --node-config
      - "partition-id=3 num-partitions=4"
    network_mode: host

  superexec-clientapp-4:
    build: ./edge_nodes
    command: [--insecure, --plugin-type, clientapp, --appio-api-address, 127.0.0.1:9097]
    environment:
      DATA_DIR: /data
      CACHE_DIR: /data/.cache/msc
      SEED: ${SEED:-42}
      CLIENT_MODE: ${CLIENT_MODE:-standard}    # standard (Arm A) | sisa (Arm B)
      POISON_MODE: ${POISON_MODE:-off}         # off | flip (Phase 1) | drop (Phase 4)
      PARTITION_ID: "3"                        # for the recovery scripts (FL clients get it via node-config)
      NUM_PARTITIONS: "4"
      NUM_SHARDS: ${NUM_SHARDS:-5}
      NUM_SLICES: ${NUM_SLICES:-5}
      CHECKPOINT_DIR: /checkpoints
      TELEMETRY_DIR: /dev/shm
      RECOVERED_MODEL_PATH: /checkpoints/recovered_model.pt
    volumes:
      - ./data:/data:ro
      - ${CHECKPOINT_HOST_DIR:-~/msc-experiment/checkpoints}:/checkpoints
      - /dev/shm:/dev/shm    # telemetry to Pi RAM, never the SD card
    network_mode: host
    depends_on:
      - supernode-4
