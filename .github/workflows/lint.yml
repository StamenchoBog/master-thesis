name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install flake8 yamllint
      - run: flake8 .
      - run: yamllint .
      - run: shellcheck experiments/*.sh experiments/run/*.sh
