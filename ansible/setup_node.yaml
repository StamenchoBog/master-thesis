---
- name: Provision Edge Node for SISA/FL Experiment (Optimized)
  hosts: edge_nodes
  become: yes
  
  tasks:
    # ==========================================
    # PHASE 1: NOISE REDUCTION & OPTIMIZATION
    # ==========================================
    
    - name: 1. Stop background APT timers to prevent random CPU/IO spikes
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: no
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
      ignore_errors: yes

    - name: 2. Disable any currently active swap (immediate effect)
      ansible.builtin.command: swapoff -a
      ignore_errors: yes

    - name: 3. Remove legacy dphys-swapfile if present (pre-trixie Raspberry Pi OS)
      ansible.builtin.apt:
        name: dphys-swapfile
        state: absent

    # Debian 13 (trixie) replaced dphys-swapfile with rpi-swap (zram + writeback
    # swap file). Without this, swap silently comes back on reboot and pollutes
    # the SD card I/O metrics the experiment is measuring.
    - name: 3b. Disable rpi-swap permanently so it doesn't regenerate swap at boot
      ansible.builtin.copy:
        dest: /etc/rpi/swap.conf
        content: |
          [Main]
          Mechanism=none
      register: rpi_swap_conf
      failed_when: false

    - name: 3c. Reload systemd generators to pick up the disabled swap config
      ansible.builtin.systemd:
        daemon_reload: yes
      when: rpi_swap_conf is succeeded

    - name: 4. Lock CPU Governor to 'Performance' (Prevents clock scaling variance)
      ansible.builtin.shell: |
        echo "performance" | tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor
      ignore_errors: yes

    # ==========================================
    # PHASE 2: SYSTEM DEPENDENCIES & DOCKER
    # ==========================================

    - name: 5. Update and upgrade APT packages
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist

    - name: 6. Install core system and hardware monitoring dependencies
      ansible.builtin.apt:
        name:
          - git
          - curl
          - python3-pip
          - python3-venv
          - sysstat
          - htop
          - jq
        state: present

    - name: 7. Check if Docker is already installed
      ansible.builtin.command: which docker
      register: docker_check
      changed_when: false
      failed_when: false

    - name: 8. Download and execute Docker installation script
      ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
      when: docker_check.rc != 0

    - name: 9. Optimize Docker Logging (Prevents background SD card writes)
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "log-driver": "local",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            }
          }
      notify: restart docker

    - name: 10. Ensure Docker service is running and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    - name: 11. Add user to the docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    # ==========================================
    # PHASE 3: WORKSPACE & TELEMETRY
    # ==========================================

    - name: 12. Create experimental workspace directory
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/msc-experiment"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: 12b. Create SISA checkpoint directory writable by the container user
      # The flwr clientapp container runs as uid 49999 (app), not the host user,
      # so the bind-mounted checkpoint dir must be world-writable or the SISA
      # client cannot save checkpoints (PermissionError on every round).
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/msc-experiment/checkpoints"
        state: directory
        mode: '0777'

    - name: 13. Deploy RAM-based hardware telemetry script
      ansible.builtin.copy:
        dest: "/home/{{ ansible_user }}/msc-experiment/monitor.sh"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
        content: |
          #!/bin/bash
          # RAM-based telemetry: writes only to /dev/shm so the SD card I/O
          # metrics reflect the FL workload alone. 1 Hz sampling.
          # I/O rates are per-second deltas (iostat without an interval reports
          # since-boot averages, which is useless here). The Marker column
          # mirrors /dev/shm/run_marker so experiment phases align with the trace.
          LOG_FILE="/dev/shm/hardware_telemetry_$(date +%Y%m%d_%H%M%S).csv"
          trap 'echo -e "\nSaved to: $LOG_FILE\nCopy this file off the Pi before rebooting!"' EXIT

          read_temp() {
            if command -v vcgencmd >/dev/null 2>&1; then
              vcgencmd measure_temp | grep -oE '[0-9]+\.[0-9]+'
            else
              awk '{printf "%.1f", $1/1000}' /sys/class/thermal/thermal_zone0/temp
            fi
          }
          read_throttled() {
            if command -v vcgencmd >/dev/null 2>&1; then
              vcgencmd get_throttled | cut -d= -f2
            else
              echo "n/a"
            fi
          }

          read -r _ pu pn ps pi pw pq psq pst _ < /proc/stat
          pstat=($(cat /sys/block/mmcblk0/stat))
          prd=${pstat[2]}; pwr=${pstat[6]}

          echo "Timestamp,Epoch_s,Temp_C,CPU_Freq_MHz,Throttled,RAM_Used_MB,IOWait_Pct,SD_Read_kBps,SD_Write_kBps,Marker" > "$LOG_FILE"
          echo "Logging to RAM: $LOG_FILE (Ctrl+C to stop)"

          while true; do
            sleep 1
            read -r _ u n s i w q sq st _ < /proc/stat
            td=$(( (u+n+s+i+w+q+sq+st) - (pu+pn+ps+pi+pw+pq+psq+pst) ))
            wd=$(( w - pw ))
            iow=$(awk -v a="$wd" -v b="$td" 'BEGIN{ if (b>0) printf "%.1f", 100*a/b; else print "0.0" }')
            pu=$u; pn=$n; ps=$s; pi=$i; pw=$w; pq=$q; psq=$sq; pst=$st

            dstat=($(cat /sys/block/mmcblk0/stat))
            rd=${dstat[2]}; wr=${dstat[6]}
            rdk=$(( (rd - prd) / 2 )); wrk=$(( (wr - pwr) / 2 ))   # 512B sectors -> kB
            prd=$rd; pwr=$wr

            freq=$(awk '{printf "%.0f", $1/1000}' /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq)
            ram=$(free -m | awk 'NR==2{print $3}')
            marker=$(cat /dev/shm/run_marker 2>/dev/null || true)

            echo "$(date +%H:%M:%S),$(date +%s),$(read_temp),$freq,$(read_throttled),$ram,$iow,$rdk,$wrk,$marker" >> "$LOG_FILE"
          done

  handlers:
    - name: restart docker
      ansible.builtin.systemd:
        name: docker
        state: restarted
