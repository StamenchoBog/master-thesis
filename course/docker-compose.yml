name: fl-ids

### Shared templates
x-supernode: &supernode
  image: flwr/supernode:1.29.0
  depends_on:
    toxiproxy-setup:
      condition: service_completed_successfully
  networks:
    - fl-network

x-clientapp: &clientapp
  build: ./edge_nodes
  environment:
    DATA_DIR: /data
  volumes:
    - ./data:/data:ro
  networks:
    - fl-network

services:

  ### Central Flower coordinator
  superlink:
    image: flwr/superlink:1.29.0
    command: [--insecure, --isolation, process]
    ports:
      - "9093:9093"
    networks:
      - fl-network

  ### Pre-processor (splits CSVs into per-node .npz caches — runs once, then exits)
  preprocessor:
    build: ./edge_nodes
    entrypoint: python
    command: /src/preprocess.py
    environment:
      DATA_DIR: /data
      NUM_PARTITIONS: "3"
    volumes:
      - ./edge_nodes:/src:ro
      - ./data:/data
    networks:
      - fl-network

  ### FL central server (Aggregator)
  superexec-serverapp:
    image: flwr/superexec:1.29.0
    command: [--insecure, --plugin-type, serverapp, --appio-api-address, superlink:9091]
    environment:
      FL_STRATEGY: fedavg      # fedavg | fedprox | krum | trimmedmean
      NUM_ROUNDS: "10"
      MIN_FIT_CLIENTS: "3"
      MIN_EVAL_CLIENTS: "3"
      MIN_AVAILABLE_CLIENTS: "3"
      RESULTS_SUFFIX: ""       # set to e.g. _chaos to avoid overwriting baseline results
    restart: on-failure:3
    volumes:
      - ./results:/results
    depends_on:
      - superlink
    networks:
      - fl-network

  ### Chaos engineering
  # toxiproxy intercepts traffic between supernodes and superlink (port 19092),
  # injecting 5ms ± 3ms latency to simulate inter-VLAN routing on a wired LAN.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:latest
    ports:
      - "8474:8474"    # REST API for inspecting or adjusting toxins at runtime
      - "19092:19092"  # Proxied FL traffic (supernode → superlink)
    depends_on:
      - superlink
    networks:
      - fl-network

  toxiproxy-setup:
    image: curlimages/curl:latest
    entrypoint: ["sh", "-c"]
    command:
      - |
        sleep 2
        curl -sf -X POST http://toxiproxy:8474/proxies \
          -H 'Content-Type: application/json' \
          -d '{"name":"superlink-fl","listen":"0.0.0.0:19092","upstream":"superlink:9092","enabled":true}'
        curl -sf -X POST http://toxiproxy:8474/proxies/superlink-fl/toxics \
          -H 'Content-Type: application/json' \
          -d '{"name":"latency","type":"latency","stream":"upstream","toxicity":1.0,"attributes":{"latency":5,"jitter":3}}'
    depends_on:
      - toxiproxy
    networks:
      - fl-network

  ### Edge Nodes
  supernode-1:
    <<: *supernode
    container_name: supernode-1
    command:
      - --insecure
      - --superlink
      - toxiproxy:19092
      - --clientappio-api-address
      - 0.0.0.0:9094
      - --isolation
      - process
      - --node-config
      - "partition-id=0 num-partitions=3"

  superexec-clientapp-1:
    <<: *clientapp
    command: [--insecure, --plugin-type, clientapp, --appio-api-address, supernode-1:9094]
    depends_on:
      supernode-1:
        condition: service_started
      preprocessor:
        condition: service_completed_successfully

  supernode-2:
    <<: *supernode
    container_name: supernode-2
    command:
      - --insecure
      - --superlink
      - toxiproxy:19092
      - --clientappio-api-address
      - 0.0.0.0:9095
      - --isolation
      - process
      - --node-config
      - "partition-id=1 num-partitions=3"

  superexec-clientapp-2:
    <<: *clientapp
    command: [--insecure, --plugin-type, clientapp, --appio-api-address, supernode-2:9095]
    depends_on:
      supernode-2:
        condition: service_started
      preprocessor:
        condition: service_completed_successfully

  supernode-3:
    <<: *supernode
    container_name: supernode-3
    command:
      - --insecure
      - --superlink
      - toxiproxy:19092
      - --clientappio-api-address
      - 0.0.0.0:9096
      - --isolation
      - process
      - --node-config
      - "partition-id=2 num-partitions=3"

  superexec-clientapp-3:
    <<: *clientapp
    command: [--insecure, --plugin-type, clientapp, --appio-api-address, supernode-3:9096]
    depends_on:
      supernode-3:
        condition: service_started
      preprocessor:
        condition: service_completed_successfully

  # Submits the FL run to superlink after all services are ready
  runner:
    image: flwr/base:1.29.0-py3.13-ubuntu24.04
    command: sh -c "sleep 5 && flwr run . --stream"
    working_dir: /app
    environment:
      FLWR_HOME: /app/.flwr
    volumes:
      - .:/app
    depends_on:
      - superexec-serverapp
      - superexec-clientapp-1
      - superexec-clientapp-2
      - superexec-clientapp-3
    networks:
      - fl-network

### Network
networks:
  fl-network:
    driver: bridge
