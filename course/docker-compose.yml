### Shared templates
x-supernode: &supernode
  image: flwr/supernode:1.29.0
  depends_on:
    - superlink
  networks:
    - fl-network

x-clientapp: &clientapp
  build: ./edge_nodes
  environment:
    DATA_DIR: /data
  volumes:
    - ./data:/data:ro
  networks:
    - fl-network

services:
  superlink:
    image: flwr/superlink:1.29.0
    command:
      - --insecure
      - --isolation
      - process
    ports:
      - "9093:9093"
    networks:
      - fl-network

  ### Data preparation (runs once) 
  preprocessor:
    build: ./edge_nodes
    entrypoint: python
    command: /src/preprocess.py
    environment:
      DATA_DIR: /data
      NUM_PARTITIONS: "3"
    volumes:
      - ./edge_nodes:/src:ro
      - ./data:/data
    networks:
      - fl-network

  ### Server (Aggregator)
  superexec-serverapp:
    image: flwr/superexec:1.29.0
    command:
      - --insecure
      - --plugin-type
      - serverapp
      - --appio-api-address
      - superlink:9091
    environment:
      FL_STRATEGY: fedavg      # fedavg | fedprox | krum | trimmedmean
      NUM_ROUNDS: "10"
      MIN_FIT_CLIENTS: "3"
      MIN_EVAL_CLIENTS: "3"
      MIN_AVAILABLE_CLIENTS: "3"
      RESULTS_SUFFIX: _chaos   # appended to result filename — remove for baseline runs
    restart: on-failure:3
    volumes:
      - ./results:/results
    depends_on:
      - superlink
    networks:
      - fl-network

  ### Edge node 1
  supernode-1:
    <<: *supernode
    command:
      - --insecure
      - --superlink
      - superlink:9092
      - --clientappio-api-address
      - 0.0.0.0:9094
      - --isolation
      - process
      - --node-config
      - "partition-id=0 num-partitions=3"

  superexec-clientapp-1:
    <<: *clientapp
    command:
      - --insecure
      - --plugin-type
      - clientapp
      - --appio-api-address
      - supernode-1:9094
    depends_on:
      supernode-1:
        condition: service_started
      preprocessor:
        condition: service_completed_successfully

  ### Edge node 2
  supernode-2:
    <<: *supernode
    command:
      - --insecure
      - --superlink
      - superlink:9092
      - --clientappio-api-address
      - 0.0.0.0:9095
      - --isolation
      - process
      - --node-config
      - "partition-id=1 num-partitions=3"

  superexec-clientapp-2:
    <<: *clientapp
    command:
      - --insecure
      - --plugin-type
      - clientapp
      - --appio-api-address
      - supernode-2:9095
    depends_on:
      supernode-2:
        condition: service_started
      preprocessor:
        condition: service_completed_successfully

  ### Edge node 3
  supernode-3:
    <<: *supernode
    command:
      - --insecure
      - --superlink
      - superlink:9092
      - --clientappio-api-address
      - 0.0.0.0:9096
      - --isolation
      - process
      - --node-config
      - "partition-id=2 num-partitions=3"

  superexec-clientapp-3:
    <<: *clientapp
    command:
      - --insecure
      - --plugin-type
      - clientapp
      - --appio-api-address
      - supernode-3:9096
    depends_on:
      supernode-3:
        condition: service_started
      preprocessor:
        condition: service_completed_successfully

  ### Runner (for run submission)
  runner:
    image: flwr/base:1.29.0-py3.13-ubuntu24.04
    command: sh -c "sleep 5 && flwr run . --stream"
    working_dir: /app
    environment:
      FLWR_HOME: /app/.flwr
    volumes:
      - .:/app
    depends_on:
      - superexec-serverapp
      - superexec-clientapp-1
      - superexec-clientapp-2
      - superexec-clientapp-3
    networks:
      - fl-network

  ### Chaos engineering
  # Simulates wired LAN conditions (inter-VLAN routing through a firewall):
  # 5ms ± 3ms latency, 0.1% packet loss. Prevents containers behaving as localhost.
  pumba:
    image: gaiaadm/pumba:latest
    command: >
      netem
      --duration 3h
      --tc-image ghcr.io/alexei-led/pumba-tc-alpine:latest
      delay --time 5 --jitter 3 --distribution normal
      loss --percent 0.1
      supernode-1 supernode-2 supernode-3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - supernode-1
      - supernode-2
      - supernode-3
    networks:
      - fl-network

networks:
  fl-network:
    driver: bridge
